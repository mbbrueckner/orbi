dependencies:
  # Uses the split esp_driver_* components (ESP-IDF 5.3+); tested with v6.0.2
  idf: ">=5.3"
  # LVGL - UI library
  lvgl/lvgl: "^8.3"
  # GC9A01 display driver (esp_lcd based)
  espressif/esp_lcd_gc9a01: "^2.0.4"
  # The CHSC6X touch and BM8563 RTC drivers live in components/input and
  # components/rtc, so no extra packages are needed for them.
